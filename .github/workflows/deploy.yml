# 把 repo 根目錄原封不動部署到 GitHub Pages。
# 這是純靜態網站（HTML + CSS + 原生 JS），沒有建置步驟，所以不需要 Node、不需要打包。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊 run 直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true 會用 API 直接把 repo 的 Pages 打開（需要上面的 pages: write 權限），
      # 省掉「到 Settings -> Pages 手動把 Source 設成 GitHub Actions」那一步。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
